name: ci

on:
  push:
  pull_request:
    # labeled/unlabeled re-run freeze-check when the integrator adds the bugfix label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Guard (blocked documents, big files, gitlinks, symlinks, secrets)
        run: python scripts/guard.py --all
      - run: ruff check . && ruff format --check .
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web unit tests (pure JS modules)
        run: node --test web/tests/*.test.mjs
      - name: Evals (fake provider, every case file)
        run: |
          for f in evals/cases/*.jsonl; do
            python -m hackkit.evals "$f" --out "evals/results/$(basename "$f" .jsonl).md"
          done

  # Real browser: open every page at desktop and phone size; fail on any JS error or sideways
  # scroll. Same check as `python scripts/shots.py --smoke` locally.
  e2e:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,pitch]"
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python scripts/shots.py --smoke

  # Demo freeze (make freeze): while the base branch has a .freeze file, only PRs carrying the
  # [freeze].label from hackkit.toml (default "bugfix") pass. `make freeze` makes this check
  # required through branch protection when the repo plan allows it.
  freeze-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Freeze check
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          freeze_file="$RUNNER_TEMP/base.freeze"
          git show "origin/$BASE_REF:.freeze" > "$freeze_file" 2>/dev/null || rm -f "$freeze_file"
          python scripts/freeze.py check --labels "$PR_LABELS" --freeze-file "$freeze_file"
