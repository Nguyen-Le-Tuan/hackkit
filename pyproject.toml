[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackkit"
version = "0.2.0"
description = "Personal hackathon framework: spend event time on the problem, not the plumbing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]
# Screenshots, demo video and slide deck: pip install -e ".[pitch]" && playwright install chromium
pitch = ["playwright>=1.45", "python-pptx>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ holds Markdown only (including agent-written plans with illustrative Python snippets);
# newer ruff formats code blocks inside Markdown, which would turn CI red on every plan merge.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# lanes.py is mostly long Vietnamese message strings.
"scripts/lanes.py" = ["E501"]
# browser_steps.py embeds the JS/CSS overlay injected into recorded pages.
"scripts/browser_steps.py" = ["E501"]
# scaffold.py holds code templates (Python and JS) as strings.
"src/hackkit/scaffold.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hackkit", "features"]
