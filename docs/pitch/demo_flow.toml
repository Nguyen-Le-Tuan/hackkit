# The demo video, as a script. Run: make demo-video  ->  docs/pitch/out/demo.mp4
# Captions are burned in, so the video works with the sound off (most judges watch muted).
# Keep it under 3 minutes (Devpost) and show the WOW moment in the first 20 seconds.
# Rewrite the captions for YOUR story; `make remove-example` points the routes at your feature.
# Steps: see the docstring of scripts/browser_steps.py.

[video]
name = "demo"
viewport = "1600x900"   # what the browser renders
size = "1920x1080"      # the video file
theme = "dark"
max_seconds = 180
tail_seconds = 1.5

[[step]]
goto = "#/"

[[step]]
title = "hackkit"
subtitle = "Messy input in, checked answers out"
seconds = 2.5

[[step]]
caption = "The problem, in one sentence: who loses what, and how often."

[[step]]
wait = 2500

[[step]]
caption = "Open the feature."

[[step]]
goto = "#/feature/receipt"      # a route, not a button label: stays valid when features change

[[step]]
wait_for = "#run"

[[step]]
caption = "Paste the input. An LLM reads it into a validated schema."

[[step]]
highlight = "#input-text"
seconds = 2

[[step]]
click = "#run"

[[step]]
wait_for = "[data-result]"

[[step]]
caption = "Plain, tested code does the math and flags what needs a human."

[[step]]
highlight = ".metrics"
seconds = 2.5

[[step]]
caption = "Ask the AI to explain it. Code checks every number it writes."

[[step]]
click = "text=Explain in plain English"

[[step]]
wait_for = ".explain-text"

[[step]]
highlight = ".callout.explain"
seconds = 3

[[step]]
caption = "Every number is computed by code, not guessed by the model."

[[step]]
hover = ".metric"

[[step]]
wait = 2000

[[step]]
caption = "Download the report or the data, ready to share."

[[step]]
scroll_to = "text=Download report (.md)"

[[step]]
wait = 2000

[[step]]
caption = ""

[[step]]
title = "hackkit"
subtitle = "Try it: make run"
seconds = 2.5
